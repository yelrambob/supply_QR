name: Wake Streamlit app

on:
  schedule:
    # Every 6 hours. A plain curl can't actually wake a
    # sleeping Streamlit Community Cloud app -- it needs a real browser click on
    # "Yes, get this app back up!", which is what wake_streamlit.py does.
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Wake app
        run: python .github/scripts/wake_streamlit.py
      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wake-streamlit-failure
          path: wake_streamlit_failure.png
          if-no-files-found: ignore
